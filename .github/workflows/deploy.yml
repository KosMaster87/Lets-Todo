name: Validate, publish image & deploy

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [main, staging, dev]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check

  publish-backend-image:
    name: Publish immutable Let's Todo API image
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ vars.GITLAB_REGISTRY_HOST }}/${{ vars.LETS_TODO_API_IMAGE }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to the private GitLab Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GITLAB_REGISTRY_HOST }}
          username: ${{ secrets.GITLAB_REGISTRY_USERNAME }}
          password: ${{ secrets.GITLAB_REGISTRY_PASSWORD }}
      - name: Build and publish the API image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ vars.GITLAB_REGISTRY_HOST }}/${{ vars.LETS_TODO_API_IMAGE }}:${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha,scope=lets-todo-api-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=lets-todo-api-${{ github.ref_name }}
      - name: Record the exact deployable image
        run: |
          {
            printf '%s\n' "## Let's Todo API image"
            printf '\n'
            printf '%s\n' "\`${{ vars.GITLAB_REGISTRY_HOST }}/${{ vars.LETS_TODO_API_IMAGE }}@${{ steps.build.outputs.digest }}\`"
            printf '\n'
            printf '%s\n' 'The next deployment stage may use only this immutable digest.'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-frontend-staging:
    needs: deploy-backend-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Install cloudflared
        run: |
          curl -sSL -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          mkdir -p ~/.ssh
      - name: Deploy frontend to Staging
        run: |
          echo "${{ secrets.UNRAID_DEPLOY_SSH_KEY_FRONTEND_STAGING }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config <<EOF
          Host deploy-lets-todo.dev2ksoftware.com
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyCommand cloudflared access ssh --hostname %h --id ${{ secrets.CF_ACCESS_CLIENT_ID }} --secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EOF
          chmod 600 ~/.ssh/config

          rsync -avz --delete \
            frontend/ root@deploy-lets-todo.dev2ksoftware.com:/mnt/nvme/appdata/static-sites/www/lets-todo-staging/

  deploy-frontend-production:
    needs: [resolve-production-image, deploy-backend-production]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-production-image.outputs.source_sha }}
      - name: Install cloudflared
        run: |
          # ubuntu-latest is a GitHub-hosted cloud runner: it has no route to the
          # Tower's private LAN address. The Cloudflare Tunnel's public hostname
          # (gated by a Service Auth policy, not a human login) is the only way
          # in - cloudflared acts as the SSH transport via ProxyCommand.
          curl -sSL -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          mkdir -p ~/.ssh
      - name: Deploy frontend to Production
        run: |
          echo "${{ secrets.UNRAID_DEPLOY_SSH_KEY_FRONTEND }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config <<EOF
          Host deploy-lets-todo.dev2ksoftware.com
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyCommand cloudflared access ssh --hostname %h --id ${{ secrets.CF_ACCESS_CLIENT_ID }} --secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EOF
          chmod 600 ~/.ssh/config

          rsync -avz --delete \
            frontend/ root@deploy-lets-todo.dev2ksoftware.com:/mnt/nvme/appdata/static-sites/www/lets-todo/

  deploy-backend-staging:
    needs: [quality, publish-backend-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Install cloudflared
        run: |
          curl -sSL -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          mkdir -p ~/.ssh
      - name: Deploy backend image to Staging
        run: |
          echo "${{ secrets.UNRAID_DEPLOY_SSH_KEY_BACKEND_STAGING }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config <<EOF
          Host deploy-lets-todo.dev2ksoftware.com
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyCommand cloudflared access ssh --hostname %h --id ${{ secrets.CF_ACCESS_CLIENT_ID }} --secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EOF
          chmod 600 ~/.ssh/config

          ssh root@deploy-lets-todo.dev2ksoftware.com \
            staging "${{ needs.publish-backend-image.outputs.digest }}"

  resolve-production-image:
    name: Resolve the exact staged API image
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.resolve.outputs.digest }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to the private GitLab Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GITLAB_REGISTRY_HOST }}
          username: ${{ secrets.GITLAB_REGISTRY_USERNAME }}
          password: ${{ secrets.GITLAB_REGISTRY_PASSWORD }}
      - name: Verify the merge and resolve its staged digest
        id: resolve
        shell: bash
        run: |
          set -Eeuo pipefail

          fail() {
            printf '::error::%s\n' "$*" >&2
            exit 1
          }

          read -r merged_sha main_parent staging_sha extra_parent < <(
            git rev-list --parents -n 1 HEAD
          )
          [[ -n ${main_parent:-} && -n ${staging_sha:-} && -z ${extra_parent:-} ]] || \
            fail 'Production requires a normal two-parent merge from staging into main.'

          git diff --quiet "${staging_sha}" "${merged_sha}" -- \
            backend frontend package.json pnpm-lock.yaml pnpm-workspace.yaml || \
            fail 'The main merge changes deployable files. Promote the unchanged staging commit.'

          image="${{ vars.GITLAB_REGISTRY_HOST }}/${{ vars.LETS_TODO_API_IMAGE }}:staging-${staging_sha}"
          digest=$(docker buildx imagetools inspect "${image}" --format '{{.Digest}}') || \
            fail "No staged registry image exists for ${staging_sha}."
          [[ ${digest} =~ ^sha256:[a-f0-9]{64}$ ]] || fail 'Registry returned an invalid image digest.'

          printf 'digest=%s\n' "${digest}" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "${staging_sha}" >> "$GITHUB_OUTPUT"
          {
            printf '%s\n' '## Production promotion source'
            printf '\n'
            printf '%s\n' "- Staging commit: \`${staging_sha}\`"
            printf '%s\n' "- API image: \`${image%@*}@${digest}\`"
            printf '%s\n' 'No production image is built in this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-backend-production:
    needs: resolve-production-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install cloudflared
        run: |
          curl -sSL -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          mkdir -p ~/.ssh
      - name: Deploy backend image to Production
        run: |
          echo "${{ secrets.UNRAID_DEPLOY_SSH_KEY_BACKEND }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config <<EOF
          Host deploy-lets-todo.dev2ksoftware.com
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyCommand cloudflared access ssh --hostname %h --id ${{ secrets.CF_ACCESS_CLIENT_ID }} --secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EOF
          chmod 600 ~/.ssh/config

          ssh root@deploy-lets-todo.dev2ksoftware.com \
            production "${{ needs.resolve-production-image.outputs.digest }}"
