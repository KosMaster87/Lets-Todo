name: Validate, publish image & deploy

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging, dev]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check

  publish-backend-image:
    name: Publish immutable Let's Todo API image
    needs: quality
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ vars.GITLAB_REGISTRY_HOST }}/${{ vars.LETS_TODO_API_IMAGE }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to the private GitLab Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GITLAB_REGISTRY_HOST }}
          username: ${{ secrets.GITLAB_REGISTRY_USERNAME }}
          password: ${{ secrets.GITLAB_REGISTRY_PASSWORD }}
      - name: Build and publish the API image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ vars.GITLAB_REGISTRY_HOST }}/${{ vars.LETS_TODO_API_IMAGE }}:${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha,scope=lets-todo-api-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=lets-todo-api-${{ github.ref_name }}
      - name: Record the exact deployable image
        run: |
          {
            printf '%s\n' "## Let's Todo API image"
            printf '\n'
            printf '%s\n' "\`${{ vars.GITLAB_REGISTRY_HOST }}/${{ vars.LETS_TODO_API_IMAGE }}@${{ steps.build.outputs.digest }}\`"
            printf '\n'
            printf '%s\n' 'The next deployment stage may use only this immutable digest.'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-frontend-staging:
    needs: quality
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Install cloudflared
        run: |
          curl -sSL -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          mkdir -p ~/.ssh
      - name: Deploy frontend to Staging
        run: |
          echo "${{ secrets.UNRAID_DEPLOY_SSH_KEY_FRONTEND_STAGING }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config <<EOF
          Host deploy-lets-todo.dev2ksoftware.com
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyCommand cloudflared access ssh --hostname %h --id ${{ secrets.CF_ACCESS_CLIENT_ID }} --secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EOF
          chmod 600 ~/.ssh/config

          rsync -avz --delete \
            frontend/ root@deploy-lets-todo.dev2ksoftware.com:/mnt/nvme/appdata/static-sites/www/lets-todo-staging/

  deploy-frontend-production:
    needs: quality
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install cloudflared
        run: |
          # ubuntu-latest is a GitHub-hosted cloud runner: it has no route to the
          # Tower's private LAN address. The Cloudflare Tunnel's public hostname
          # (gated by a Service Auth policy, not a human login) is the only way
          # in - cloudflared acts as the SSH transport via ProxyCommand.
          curl -sSL -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          mkdir -p ~/.ssh
      - name: Deploy frontend to Production
        run: |
          echo "${{ secrets.UNRAID_DEPLOY_SSH_KEY_FRONTEND }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config <<EOF
          Host deploy-lets-todo.dev2ksoftware.com
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyCommand cloudflared access ssh --hostname %h --id ${{ secrets.CF_ACCESS_CLIENT_ID }} --secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EOF
          chmod 600 ~/.ssh/config

          rsync -avz --delete \
            frontend/ root@deploy-lets-todo.dev2ksoftware.com:/mnt/nvme/appdata/static-sites/www/lets-todo/

  deploy-backend-staging:
    needs: [quality, publish-backend-image]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Install cloudflared
        run: |
          curl -sSL -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          mkdir -p ~/.ssh
      - name: Deploy backend image to Staging
        run: |
          echo "${{ secrets.UNRAID_DEPLOY_SSH_KEY_BACKEND_STAGING }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config <<EOF
          Host deploy-lets-todo.dev2ksoftware.com
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyCommand cloudflared access ssh --hostname %h --id ${{ secrets.CF_ACCESS_CLIENT_ID }} --secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EOF
          chmod 600 ~/.ssh/config

          ssh root@deploy-lets-todo.dev2ksoftware.com \
            staging "${{ needs.publish-backend-image.outputs.digest }}"

  deploy-backend-production:
    needs: [quality, publish-backend-image]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install cloudflared
        run: |
          curl -sSL -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          mkdir -p ~/.ssh
      - name: Deploy backend image to Production
        run: |
          echo "${{ secrets.UNRAID_DEPLOY_SSH_KEY_BACKEND }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config <<EOF
          Host deploy-lets-todo.dev2ksoftware.com
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyCommand cloudflared access ssh --hostname %h --id ${{ secrets.CF_ACCESS_CLIENT_ID }} --secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EOF
          chmod 600 ~/.ssh/config

          ssh root@deploy-lets-todo.dev2ksoftware.com \
            production "${{ needs.publish-backend-image.outputs.digest }}"
