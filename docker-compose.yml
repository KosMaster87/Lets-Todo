services:
  backend-staging:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: local/lets-todo-api-staging:latest
    container_name: lets-todo-api-staging
    restart: unless-stopped
    env_file:
      - backend/config/env/.env.staging
    environment:
      NODE_ENV: staging
      DB_HOST: lets-todo-mariadb
    ports:
      - "3904:3004"
    networks:
      - lets-todo-net
      - smtp-relay-net

  backend-production:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: local/lets-todo-api:latest
    container_name: lets-todo-api
    restart: unless-stopped
    env_file:
      - backend/config/env/.env.production
    environment:
      NODE_ENV: production
      DB_HOST: lets-todo-mariadb
    ports:
      - "3902:3002"
    networks:
      - lets-todo-net
      - smtp-relay-net

networks:
  lets-todo-net:
    driver: bridge
  smtp-relay-net:
    external: true
